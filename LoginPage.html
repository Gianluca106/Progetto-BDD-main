<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title> Login Page</title>
</head>
<body>
   <div align="center">
        <header> Login Page </header>
    <form name="Login" action="loginhandler.php"
              method="post">
            <br><br>
            <input type="hidden" name="formtype" value="login">
            <label for="text">Username:</label><br>
            <input type="text" size="25" name="username" placeholder="user" required> <br>
            <label for="password">Password: </label> <br>
            <input type="password" size="25" name="password" placeholder="password" required> <br>
            <button type="submit" name="login"> Accedi </button> <br> <br>
   </div>
    </form>
    <div align="center">
    <form name="Register" action="loginhandler.php"
              method="post">
            <br><br>
            <input type="hidden" name="formtype" value="register">

            <label for="text">Username:</label><br>
            <input type="text" size="25" name="username" placeholder="user" required> <br>

            <label for="password">Password: </label> <br>
            <input type="password" size="25" name="password" placeholder="password" required> <br>

            <label for="text">Nome:</label><br>
            <input type="text" size="25" name="nome" placeholder="nome" required> <br>

            <label for="text">Cognome: </label> <br>
            <input type="text" size="25" name="cognome" placeholder="cognome" required> <br>

            <label for="text">Indirizzo: </label> <br>
            <input type="text" size="25" name="indirizzo" placeholder="indirizzo" required> <br>

            <button type="submit" name="register"> Registrati </button> <br>
   </div>
    </form>
</body>
</html>
